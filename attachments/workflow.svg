<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AgenticPD Execution Workflow</title>
  <desc id="desc">The original iterative optimizer and the multi-agent Doomed and GWTW demo workflow, with shared ORFS execution and evidence outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="demoLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f5f2"/>
      <stop offset="1" stop-color="#f2f8f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#415a72"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#087f73"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}
      .title{font-size:34px;font-weight:700;letter-spacing:.2px}
      .subtitle{font-size:16px;fill:#60758a}
      .laneTitle{font-size:22px;font-weight:700}
      .laneSub{font-size:14px;fill:#64788b}
      .box{fill:#fff;stroke:#9fb1c1;stroke-width:1.4;rx:10;filter:url(#shadow)}
      .boxBlue{fill:#eef5fb;stroke:#5a87ad}
      .boxTeal{fill:#ebf7f4;stroke:#2a9689}
      .boxAmber{fill:#fff6e8;stroke:#c08b39}
      .boxRed{fill:#fff0ef;stroke:#c96c63}
      .boxPurple{fill:#f4f0fb;stroke:#8b6daf}
      .label{font-size:16px;font-weight:650;text-anchor:middle}
      .small{font-size:12.5px;fill:#52687a;text-anchor:middle}
      .arrow{fill:none;stroke:#415a72;stroke-width:2.1;marker-end:url(#arrow)}
      .arrowTeal{fill:none;stroke:#087f73;stroke-width:2.2;marker-end:url(#arrowTeal)}
      .dash{fill:none;stroke:#7c91a4;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .stage{font-size:15px;font-weight:700;text-anchor:middle;fill:#fff}
      .section{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#718599}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="62" class="title">AgenticPD Execution Workflow</text>
  <text x="70" y="91" class="subtitle">Two explicit entry paths share stage-aware agents, checkpoint reuse, ORFS execution, and auditable session evidence.</text>

  <!-- Original lane -->
  <rect x="55" y="125" width="1490" height="245" rx="18" fill="#f7fafc" stroke="#c5d1dc"/>
  <text x="82" y="160" class="laneTitle">Original Multi-Agent Optimization</text>
  <text x="82" y="184" class="laneSub">main.py → Optimizer.run() · one branch proposal per iteration</text>

  <rect x="90" y="220" width="180" height="78" class="box boxBlue"/>
  <text x="180" y="250" class="label">CLI + Config</text>
  <text x="180" y="273" class="small">main.py · FrameworkConfig</text>

  <rect x="330" y="220" width="205" height="78" class="box boxPurple"/>
  <text x="432" y="250" class="label">JudgeAgent</text>
  <text x="432" y="273" class="small">branch node · start stage · hints</text>

  <rect x="595" y="207" width="235" height="104" class="box boxPurple"/>
  <text x="712" y="238" class="label">4 × StageAgent</text>
  <text x="712" y="262" class="small">FPAgent · PLAgent</text>
  <text x="712" y="283" class="small">CTSAgent · RTAgent</text>

  <rect x="890" y="220" width="190" height="78" class="box boxAmber"/>
  <text x="985" y="250" class="label">Optimizer</text>
  <text x="985" y="273" class="small">run_iteration() · tree update</text>

  <rect x="1140" y="220" width="170" height="78" class="box boxTeal"/>
  <text x="1225" y="250" class="label">ORFS Flow</text>
  <text x="1225" y="273" class="small">FP → PL → CTS → RT</text>

  <rect x="1370" y="220" width="140" height="78" class="box"/>
  <text x="1440" y="250" class="label">Final QoR</text>
  <text x="1440" y="273" class="small">WNS · TNS · area · power</text>

  <path d="M270 259 H330" class="arrow"/>
  <path d="M535 259 H595" class="arrow"/>
  <path d="M830 259 H890" class="arrow"/>
  <path d="M1080 259 H1140" class="arrow"/>
  <path d="M1310 259 H1370" class="arrow"/>
  <path d="M1440 298 C1440 337 985 340 985 300" class="dash"/>
  <text x="1215" y="348" class="small">next iteration uses history + OptimizationTree</text>

  <!-- Demo lane -->
  <rect x="55" y="400" width="1490" height="410" rx="18" fill="url(#demoLane)" stroke="#9fc7bf"/>
  <text x="82" y="438" class="laneTitle">Multi-Agent + Doomed/GWTW Demo</text>
  <text x="82" y="462" class="laneSub">multi_agent_gwtw.py → MultiAgentGWTWOrchestrator.run() · population barriers at PL and CTS</text>

  <rect x="90" y="500" width="210" height="78" class="box boxBlue"/>
  <text x="195" y="530" class="label">Experiment YAML</text>
  <text x="195" y="553" class="small">population · quotas · seed · budget</text>

  <rect x="355" y="488" width="235" height="102" class="box boxPurple"/>
  <text x="472" y="518" class="label">Judge + Stage Agents</text>
  <text x="472" y="542" class="small">candidate proposals for FP / PL / CTS / RT</text>
  <text x="472" y="564" class="small">survivor parent selection is validated</text>

  <rect x="650" y="500" width="160" height="78" class="box boxTeal"/>
  <text x="730" y="530" class="label">Population</text>
  <text x="730" y="553" class="small">execute FP → PL</text>

  <rect x="870" y="483" width="220" height="112" class="box boxRed"/>
  <text x="980" y="514" class="label">PL Decision Barrier</text>
  <text x="980" y="538" class="small">build_minimal_observation()</text>
  <text x="980" y="558" class="small">predict() → schedule()</text>
  <text x="980" y="578" class="small">continue · pause · audit</text>

  <rect x="1150" y="500" width="170" height="78" class="box boxAmber"/>
  <text x="1235" y="530" class="label">PL Fork</text>
  <text x="1235" y="553" class="small">resolve_checkpoint() → CTS</text>

  <rect x="1375" y="500" width="135" height="78" class="box boxTeal"/>
  <text x="1442" y="530" class="label">CTS Cohort</text>
  <text x="1442" y="553" class="small">parent + children</text>

  <rect x="870" y="655" width="220" height="112" class="box boxRed"/>
  <text x="980" y="686" class="label">CTS Decision Barrier</text>
  <text x="980" y="710" class="small">Doomed classification</text>
  <text x="980" y="730" class="small">GWTW allocation</text>
  <text x="980" y="750" class="small">survivor whitelist</text>

  <rect x="1150" y="672" width="170" height="78" class="box boxAmber"/>
  <text x="1235" y="702" class="label">CTS Fork</text>
  <text x="1235" y="725" class="small">resolve_checkpoint() → RT</text>

  <rect x="1375" y="672" width="135" height="78" class="box boxTeal"/>
  <text x="1442" y="702" class="label">Finish</text>
  <text x="1442" y="725" class="small">post-route QoR</text>

  <path d="M300 539 H355" class="arrowTeal"/>
  <path d="M590 539 H650" class="arrowTeal"/>
  <path d="M810 539 H870" class="arrowTeal"/>
  <path d="M1090 539 H1150" class="arrowTeal"/>
  <path d="M1320 539 H1375" class="arrowTeal"/>
  <path d="M1442 578 V622 C1442 636 980 628 980 655" class="arrowTeal"/>
  <path d="M1090 711 H1150" class="arrowTeal"/>
  <path d="M1320 711 H1375" class="arrowTeal"/>

  <text x="880" y="625" class="small">paused trials retain evidence</text>

  <!-- Shared evidence -->
  <text x="70" y="855" class="section">SHARED AUDIT TRAIL</text>
  <rect x="70" y="875" width="280" height="76" class="box"/>
  <text x="210" y="904" class="label">Trial Evidence</text>
  <text x="210" y="928" class="small">TrialRecord · StageResult · final_qor</text>

  <rect x="390" y="875" width="280" height="76" class="box"/>
  <text x="530" y="904" class="label">Checkpoint Evidence</text>
  <text x="530" y="928" class="small">CheckpointRef · manifest · ExecutionResolution</text>

  <rect x="710" y="875" width="250" height="76" class="box"/>
  <text x="835" y="904" class="label">Decision Trace</text>
  <text x="835" y="928" class="small">traces/decisions.jsonl</text>

  <rect x="1000" y="875" width="250" height="76" class="box"/>
  <text x="1125" y="904" class="label">Optimization Tree</text>
  <text x="1125" y="928" class="small">tree.json · parent / child provenance</text>

  <rect x="1290" y="875" width="240" height="76" class="box"/>
  <text x="1410" y="904" class="label">Offline View</text>
  <text x="1410" y="928" class="small">visualization/index.html</text>
</svg>
