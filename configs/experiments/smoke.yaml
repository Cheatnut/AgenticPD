# =============================================================================
# AgenticPD Experiment Declaration - Stage A Smoke Test
# =============================================================================
#
# This file is a complete declaration of one experiment. Any field change alters
# results; it must be version-controlled. Never casually edit a declaration for
# an already-run experiment.
#
# For each new experiment, copy this file as <date>-<design>-<method>.yaml,
# modify the relevant fields, then run. Keep old files as historical evidence.
# =============================================================================

schema_version: 1
experiment_id: agenticpd-smoke-sky130hd-gcd-v1
purpose: "Verify Trial creation, ORFS invocation, and QoR parsing chain; not for paper conclusions"
created_at: 2026-07-27

# =============================================================================
# 1. Design Hierarchy and Valid Scope
# =============================================================================
# This project currently uses only sky130hd PDK designs. Valid sky130hd designs
# in ORFS (ls flow/designs/sky130hd/):
#   aes  chameleon  gcd  ibex  jpeg  microwatt  riscv32i
#
# Role definitions:
#   smoke       - smallest design; must pass on every change; used for fast regression
#   development - dev designs; used for prompt/threshold/strategy tuning
#   held_out    - held-out design; frozen throughout; used only for final evaluation
# =============================================================================

roles:
  smoke:
    platform: sky130hd
    design: gcd
  development:
    - platform: sky130hd
      design: aes
    - platform: sky130hd
      design: ibex
  held_out:
    platform: sky130hd
    design: jpeg

# =============================================================================
# 2. Environment Version Locking
# =============================================================================
# Reproducible experiments require every component traceable to a unique version.
# Record honestly; must be completed before running on school server.

revisions:
  orfs:
    commit: unresolved
    reason: "ORFS worktree .git was deleted; cannot retrieve commit SHA"
    action_required: "After git clone on school server, record git rev-parse HEAD"
    directory: "~/OpenROAD-flow-scripts"
    install_date: "2025-07-02 (build_openroad.log timestamp)"

  openroad:
    version: "26Q3-18-g5c5380c49a"
    binary: "tools/install/OpenROAD/bin/openroad"
    build: "Local build (build_openroad.sh), 16 threads"

  pdk:
    name: sky130hd
    source: "SkyWater SKY130 public PDK, installed via ORFS dependencies"
    revision: unresolved
    action_required: "Record PDK package source and version"

  python:
    version: "3.10.12"
    executable: python3

  os:
    name: "Ubuntu (WSL2)"
    kernel: "Linux x86_64"

# =============================================================================
# 3. Budget and Seed
# =============================================================================
# Budget defines the maximum resources one experiment may consume. Exceeding any
# limit ends the experiment.
#
# Budget types:
#   max_trials        - max number of complete RTL->GDS flows (including failures)
#   max_wallclock_h   - max wall-clock hours
#   max_llm_tokens    - max LLM token consumption (N/A for this run)
#   timeout_per_trial - per-trial timeout (seconds); kill process group on expiry
#
# seed fixes the random number generator so random search / Agent behavior is
# reproducible. This smoke test has no randomness; seed is a placeholder.

budget:
  max_trials: 1
  max_wallclock_h: 2
  max_llm_tokens: 0            # smoke does not call LLM
  timeout_per_trial_s: 3600
  seed: 20260727

# =============================================================================
# 4. Parameter Space
# =============================================================================
# First-edition parameter space (param-space-v1): 9 parameters across
# FP / PL / CTS / RT four stages. Defined in agenticpd/config.py::PARAM_SPACE.
#
# Version upgrade rules:
#   - Add/remove parameters -> bump major version (v1 -> v2)
#   - Modify parameter ranges/defaults -> bump minor version (v1.0 -> v1.1)
#   - Parameter space version must be recorded in every trial record

search_space:
  version: param-space-v1
  source_file: "agenticpd/config.py"
  source_object: "PARAM_SPACE"
  parameter_count: 9
  baseline_defaults: "agenticpd/config.py::BASELINE_PARAMS"
  note: >-
    Parameter ranges originally referenced sky130hd/gcd AutoTuner JSON
    (flow/designs/sky130hd/gcd/autotuner.json).
    When switching to development/held_out designs, scale-sensitive parameters
    like CORE_UTILIZATION must be recalibrated; do not reuse gcd ranges directly.

  # Parameter inventory (synced with config.py; declaration only; code authority is config.py)
  parameters:
    FP:
      - name: CORE_UTILIZATION
        type: int
        range: [20, 50]
        default: 38
        description: "Core utilization (%). Higher = smaller area but more routing congestion"
      - name: CORE_ASPECT_RATIO
        type: float
        range: [0.5, 2.0]
        default: 1.0
        description: "Core aspect ratio"
    PL:
      - name: PLACE_DENSITY_LB_ADDON
        type: float
        range: [0.0, 0.2]
        default: null
        description: "Placement density margin"
      - name: CELL_PAD_IN_SITES_GLOBAL_PLACEMENT
        type: int
        range: [0, 3]
        default: 0
        description: "Cell padding in global placement (in sites)"
    CTS:
      - name: CTS_CLUSTER_SIZE
        type: int
        range: [10, 200]
        default: null
        description: "Max sinks per clock cluster"
      - name: CTS_CLUSTER_DIAMETER
        type: int
        range: [20, 400]
        default: null
        description: "Max cluster diameter (um)"
      - name: SETUP_SLACK_MARGIN
        type: float
        range: [0.0, 0.2]
        default: 0.0
        description: "repair_timing setup slack margin (ns); affects FP/CTS/GRT simultaneously"
    RT:
      - name: FASTROUTE_LAYER_ADJUSTMENT
        type: float
        range: [0.1, 0.3]
        default: 0.2
        description: "Routing layer capacity adjustment (implemented via generated fastroute.tcl)"
      - name: GRT_CONGESTION_ITERATIONS
        type: int
        range: [10, 50]
        default: 30
        description: "Global routing congestion mitigation iterations"

# =============================================================================
# 5. Evaluator
# =============================================================================
# The evaluator is the sole authority for judging trial quality. This document
# locks the evaluator version and rules so later comparisons never accidentally
# change the rules.
#
# Upgrade rules:
#   - Change comparison priority / tolerances / gate conditions -> bump version
#   - Experiments run with a new evaluator version cannot be directly QoR-ranked
#     against old versions

evaluator:
  version: evaluator-v1
  source_file: "agenticpd/utils.py"
  source_function: "qor_is_better(new, old, wns_tol_ps, tns_tol_ps)"
  rule: "timing-first"
  description: >-
    Timing-first multi-tier comparator:
    1. Both WNS >= 0 (both converged) -> skip timing, compare power/area directly
    2. |Delta_WNS| > 10 ps -> larger WNS wins
    3. |Delta_TNS| > 50 ps -> larger TNS wins
    4. Lower power wins -> smaller area wins -> exact tie = not better (keep old best)
    5. None / incomplete QoR never wins
  tolerances:
    wns_tol_ps: 10.0
    tns_tol_ps: 50.0
  qor_source: "6_report.json (JSON preferred); 6_finish.rpt + 6_report.log (fallback)"
  guardrails:
    - "DRC-failing runs excluded from QoR comparison"
    - "Intermediate stage metrics are for decisions only; final winner determined by post-route"
    - "All tolerances locked before experiment starts; no post-hoc adjustment"

# =============================================================================
# 6. Acceptance Criteria (smoke-test specific)
# =============================================================================

acceptance:
  required_outputs:
    - "6_report.json"
    - "6_finish.rpt"
    - "6_report.log"
  require_complete_qor: true   # All four metrics (WNS/TNS/Area/Power) must be present
  allow_network: false          # smoke does not call LLM or access network
  allow_llm: false
  make_test_must_pass: true     # make test must pass all 21 cases
